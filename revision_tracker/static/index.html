<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand"><span class="logo" aria-hidden="true">✓</span><span>Revision Tracker</span></div>
    <a href="#/due" data-nav="due"><span class="k">1</span>Due today<span class="badge" id="due-badge" hidden></span></a>
    <a href="#/chapters" data-nav="chapters"><span class="k">2</span>Chapters</a>
    <a href="#/dashboard" data-nav="dashboard"><span class="k">3</span>Dashboard</a>
    <a href="#/papers" data-nav="papers"><span class="k">4</span>Past papers</a>
    <a href="#/mistakes" data-nav="mistakes"><span class="k">5</span>Mistakes</a>
    <a href="#/settings" data-nav="settings"><span class="k">6</span>Settings</a>
    <div class="sidebar-foot">
      <div id="today-label" class="muted"></div>
      <div id="streak-label" class="muted"></div>
      <button class="ghost small" data-action="theme" title="Toggle dark mode (T)">◐ Theme</button>
      <button class="ghost small" data-action="help" title="Keyboard shortcuts (?)">⌨ Shortcuts</button>
    </div>
  </nav>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
</div>
<div id="offline" class="offline" role="alert" hidden>Revision Tracker isn't running any more. Double-click the launcher to start it again — your data is safe.</div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tooltip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
